name: Security\non:\n  push:\n  pull_request:\n  schedule:\n    - cron: "17 3 * * 1"\npermissions:\n  contents: read\njobs:\n  audit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - run: python -m pip install --upgrade pip\n      - run: pip install -e . pip-audit\n      - run: pip-audit\n